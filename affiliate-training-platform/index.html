<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Affiliate Training Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white">
  <main class="min-h-screen flex items-center justify-center px-4 py-10">
    <section class="w-full max-w-2xl">
      <div class="mb-8 text-center">
        <div class="inline-flex items-center rounded-full bg-emerald-400/10 px-4 py-2 text-sm font-semibold text-emerald-300 ring-1 ring-emerald-400/30">
          Affiliate Training Registration
        </div>
        <h1 class="mt-5 text-4xl font-black tracking-tight sm:text-5xl">Start your training journey</h1>
        <p class="mt-4 text-slate-300">Register for KES 100 and become an agent after successful payment.</p>
      </div>

      <div id="refBadge" class="mb-5 hidden rounded-2xl border border-indigo-400/30 bg-indigo-500/10 p-4 text-center text-indigo-200">
        Invited by Agent: <span id="refCodeLabel" class="font-black"></span>
      </div>

      <form id="registrationForm" class="rounded-3xl bg-white p-6 text-slate-900 shadow-2xl sm:p-8">
        <input id="refCode" name="refCode" type="hidden" value="DIRECT">

        <label class="block text-sm font-bold">Full name</label>
        <input id="name" required maxlength="120" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-indigo-500" placeholder="Your full name">

        <label class="mt-5 block text-sm font-bold">M-Pesa phone number</label>
        <input id="phone" required inputmode="tel" autocomplete="tel" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-indigo-500" placeholder="07XXXXXXXX or 2547XXXXXXXX">

        <div class="mt-6 rounded-2xl bg-slate-50 p-4 text-sm text-slate-600">
          <div class="flex justify-between"><span>Registration</span><strong>KES 100</strong></div>
          <div class="mt-2 flex justify-between"><span>Agent commission</span><strong>KES 80</strong></div>
          <div class="mt-2 flex justify-between"><span>Company share</span><strong>KES 20</strong></div>
        </div>

        <button id="submitBtn" class="mt-6 w-full rounded-xl bg-indigo-600 px-5 py-4 font-black text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50">
          Register & Pay KES 100
        </button>
        <p id="message" class="mt-4 text-center text-sm"></p>
      </form>
    </section>
  </main>

  <div id="loadingOverlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/90 px-6">
    <div class="w-full max-w-md rounded-3xl bg-white p-8 text-center text-slate-900 shadow-2xl">
      <div class="mx-auto h-12 w-12 animate-spin rounded-full border-4 border-slate-200 border-t-indigo-600"></div>
      <h2 class="mt-6 text-2xl font-black">Payment request sent</h2>
      <p class="mt-3 text-slate-600">Check your phone for the M-Pesa PIN prompt popup...</p>
      <p id="overlayMessage" class="mt-4 text-sm text-slate-500"></p>
    </div>
  </div>

<script>
const form = document.getElementById('registrationForm');
const refInput = document.getElementById('refCode');
const refBadge = document.getElementById('refBadge');
const refLabel = document.getElementById('refCodeLabel');
const submitBtn = document.getElementById('submitBtn');
const message = document.getElementById('message');
const overlay = document.getElementById('loadingOverlay');
const overlayMessage = document.getElementById('overlayMessage');

function normalizePhone(phone) {
  const p = phone.replace(/\s+/g, '').replace(/^\+/, '');
  if (/^07\d{8}$/.test(p)) return '254' + p.slice(1);
  if (/^01\d{8}$/.test(p)) return '254' + p.slice(1);
  if (/^254\d{9}$/.test(p)) return p;
  throw new Error('Enter a valid Kenyan mobile number.');
}

function setMessage(text, ok = false) {
  message.textContent = text;
  message.className = 'mt-4 text-center text-sm ' + (ok ? 'text-emerald-600' : 'text-red-600');
}

const params = new URLSearchParams(window.location.search);
const ref = (params.get('ref') || 'DIRECT').trim().toUpperCase() || 'DIRECT';
refInput.value = ref;
if (ref !== 'DIRECT') {
  refLabel.textContent = ref;
  refBadge.classList.remove('hidden');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  setMessage('');
  try {
    const name = document.getElementById('name').value.trim();
    const phone = normalizePhone(document.getElementById('phone').value);
    if (name.length < 2) throw new Error('Enter your full name.');

    const pendingRes = await fetch('/api/register-pending-trainee', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, phone, refCode: refInput.value})
    });
    const pending = await pendingRes.json();
    if (!pendingRes.ok) throw new Error(pending.error || 'Could not register.');

    overlay.classList.remove('hidden');
    overlay.classList.add('flex');
    overlayMessage.textContent = 'Creating your secure payment request...';

    const stkRes = await fetch('/api/initiate-stk', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name,
        phone,
        refCode: refInput.value,
        registrationId: pending.userId
      })
    });
    const stk = await stkRes.json();
    if (!stkRes.ok) throw new Error(stk.error || 'Could not initiate payment.');

    overlayMessage.textContent = stk.message || 'Approve the payment on your phone.';
  } catch (err) {
    overlay.classList.add('hidden');
    overlay.classList.remove('flex');
    setMessage(err.message || 'Something went wrong.');
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
