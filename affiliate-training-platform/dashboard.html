<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <header class="bg-slate-950 text-white">
    <div class="mx-auto max-w-6xl px-4 py-7">
      <h1 class="text-3xl font-black">Agent Dashboard</h1>
      <p class="mt-1 text-slate-300">Track recruits and commission activity.</p>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8">
    <form id="lookupForm" class="rounded-3xl bg-white p-5 shadow-sm">
      <label class="text-sm font-bold">Your unique agent code</label>
      <div class="mt-2 flex flex-col gap-3 sm:flex-row">
        <input id="agentCode" required class="flex-1 rounded-xl border border-slate-200 px-4 py-3 uppercase outline-none focus:border-indigo-500" placeholder="e.g. CM1234">
        <button class="rounded-xl bg-indigo-600 px-6 py-3 font-bold text-white hover:bg-indigo-700">View Stats</button>
      </div>
      <p id="error" class="mt-3 text-sm text-red-600"></p>
    </form>

    <section id="shareBox" class="mt-6 hidden rounded-3xl border border-indigo-200 bg-indigo-50 p-5">
      <p class="text-sm font-bold text-indigo-700">Your referral link</p>
      <div class="mt-2 flex flex-col gap-3 sm:flex-row">
        <input id="shareLink" readonly class="flex-1 rounded-xl border border-indigo-100 bg-white px-4 py-3 text-sm">
        <button id="copyBtn" type="button" class="rounded-xl bg-indigo-600 px-5 py-3 font-bold text-white">Copy Link to Clipboard</button>
      </div>
      <p id="copyStatus" class="mt-2 text-sm text-emerald-700"></p>
    </section>

    <section id="stats" class="mt-6 hidden grid gap-4 md:grid-cols-3">
      <div class="rounded-3xl bg-white p-6 shadow-sm">
        <p class="text-sm text-slate-500">Total Trainees Recruited</p>
        <p id="totalTrainees" class="mt-2 text-4xl font-black">0</p>
      </div>
      <div class="rounded-3xl bg-white p-6 shadow-sm">
        <p class="text-sm text-slate-500">Unpaid Commissions Balance</p>
        <p id="unpaid" class="mt-2 text-4xl font-black">KES 0.00</p>
      </div>
      <div class="rounded-3xl bg-white p-6 shadow-sm">
        <p class="text-sm text-slate-500">Total Paid Out Balance</p>
        <p id="paid" class="mt-2 text-4xl font-black">KES 0.00</p>
      </div>
    </section>

    <section id="history" class="mt-6 hidden overflow-hidden rounded-3xl bg-white shadow-sm">
      <div class="border-b px-5 py-4"><h2 class="font-black">Recruitment History</h2></div>
      <div class="overflow-x-auto">
        <table class="min-w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-500">
            <tr><th class="px-5 py-4">Trainee Phone</th><th class="px-5 py-4">Commission</th><th class="px-5 py-4">Status</th><th class="px-5 py-4">Processed</th></tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </section>
  </main>

<script>
const form = document.getElementById('lookupForm');
const codeInput = document.getElementById('agentCode');
const error = document.getElementById('error');

function money(v) {
  return 'KES ' + Number(v || 0).toFixed(2);
}
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const agentCode = codeInput.value.trim().toUpperCase();
  error.textContent = '';
  try {
    const res = await fetch('/api/get-agent-stats?agentCode=' + encodeURIComponent(agentCode));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Unable to load stats.');

    document.getElementById('stats').classList.remove('hidden');
    document.getElementById('history').classList.remove('hidden');
    document.getElementById('totalTrainees').textContent = data.totalTrainees;
    document.getElementById('unpaid').textContent = money(data.unpaidCommissionsBalance);
    document.getElementById('paid').textContent = money(data.totalPaidOutBalance);

    const link = window.location.origin + '/?ref=' + encodeURIComponent(agentCode);
    document.getElementById('shareLink').value = link;
    document.getElementById('shareBox').classList.remove('hidden');

    const rows = data.history.map(item => `
      <tr class="border-t">
        <td class="px-5 py-4 font-medium">${esc(item.trainee_phone)}</td>
        <td class="px-5 py-4">${money(item.amount_earned)}</td>
        <td class="px-5 py-4">
          <span class="rounded-full px-3 py-1 text-xs font-bold ${item.payout_status === 'paid' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
            ${esc(item.payout_status)}
          </span>
        </td>
        <td class="px-5 py-4 text-slate-500">${esc(new Date(item.processed_at).toLocaleString())}</td>
      </tr>`).join('');
    document.getElementById('historyBody').innerHTML = rows || '<tr><td colspan="4" class="px-5 py-8 text-center text-slate-500">No recruitments found.</td></tr>';
  } catch (err) {
    error.textContent = err.message;
  }
});

document.getElementById('copyBtn').addEventListener('click', async () => {
  const link = document.getElementById('shareLink').value;
  await navigator.clipboard.writeText(link);
  document.getElementById('copyStatus').textContent = 'Referral link copied.';
});
</script>
</body>
</html>
